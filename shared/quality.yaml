managers:
  #---------------------------------------------------------------
  - name: Fail if missing coordinates
    checker:
      classname: tsdat.qc.checkers.CheckMissing
    handlers:
      - classname: tsdat.qc.handlers.RemoveFailedValues
    apply_to:
      - COORDS

  - name: Fail if monotonic coordinates
    checker:
      classname: tsdat.qc.checkers.CheckMonotonic
      parameters:
        require_increasing: true
    handlers:
      - classname: tsdat.qc.handlers.RemoveFailedValues
    apply_to:
      - time

    #---------------------------------------------------------------
  - name: Remove missing data
    checker:
      classname: tsdat.qc.checkers.CheckMissing
    handlers:
      - classname: tsdat.qc.handlers.RemoveFailedValues
      - classname: tsdat.qc.handlers.RecordQualityResults
        parameters:
          assessment: bad
          meaning: "Value is equal to _FillValue or NaN"
    apply_to:
      - DATA_VARS
    exclude: [spl, spsdl]

  - name: Flag data below minimum failure threshold
    checker:
      classname: tsdat.qc.checkers.CheckValidMin
    handlers:
      - classname: tsdat.qc.handlers.RemoveFailedValues
      - classname: tsdat.qc.handlers.RecordQualityResults
        parameters:
          assessment: bad
          meaning: "Value is less than valid_min."
    apply_to:
      - DATA_VARS

  - name: Flag data above maximum failure threshold
    checker:
      classname: tsdat.qc.checkers.CheckValidMax
    handlers:
      - classname: tsdat.qc.handlers.RemoveFailedValues
      - classname: tsdat.qc.handlers.RecordQualityResults
        parameters:
          assessment: bad
          meaning: "Value is greater than valid_max."
    apply_to:
      - DATA_VARS

  - name: Flag data below minimum warning threshold
    checker:
      classname: tsdat.qc.checkers.CheckWarnMin
    handlers:
      - classname: tsdat.qc.handlers.RecordQualityResults
        parameters:
          assessment: bad
          meaning: "Value is less than warn_min."
    apply_to:
      - DATA_VARS

  - name: Flag data above maximum warning threshold
    checker:
      classname: tsdat.qc.checkers.CheckWarnMax
    handlers:
      - classname: tsdat.qc.handlers.RecordQualityResults
        parameters:
          assessment: bad
          meaning: "Value is greater than warn_max."
    apply_to:
      - DATA_VARS
