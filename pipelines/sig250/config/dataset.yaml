attrs:
  title: PacWave FLOATr ADCP data
  location_id: pws
  dataset_name: sig250
  data_level: a1
  qualifier: "001"
  description: " "

  summary: Up-looking Nortek Signature250 (250 kHz) ADCP installed
    on a bottom lander at PacWave measuring water velocity and waves
  keywords: PACWAVE, WATER VELOCITY
  Conventions: CF-1.6, ACDD-1.3, IOOS-1.2
  featureType: timeSeries
  id: adcp
  naming_authority: gov.pnnl
  infoUrl: https://mhkdr.openei.org/submissions/596
  license: Freely Distributed
  standard_name_vocabulary: CF Standard Name Table v84  # Attribution
  creator_country: USA
  creator_email: ""
  creator_institution: Oregon State University
  creator_institution_url: https://ceoas.oregonstate.edu/
  creator_sector: academic
  creator_type: institution
  creator_url: https://ceoas.oregonstate.edu/
  institution: Oregon State University
  publisher_country: USA
  publisher_email: tsdat@pnnl.gov
  publisher_institution: Pacific Northwest National Laboratory (PNNL)
  publisher_url: https://www.pnnl.gov/
  acknowledgement: Data efforts funded by US Department of Energy
  platform: lander
  platform_vocabulary: https://mmisw.org/ont/ioos/platform
  # platform_id:
  platform_name: Sig250
  instrument: In Situ/Laboratory Instruments > Current/Wind Meters > Current Meters
  instrument_vocabulary: GCMD Instrument Keywords #https://gcmd.earthdata.nasa.gov/KeywordViewer/
  make_model: Nortek Signature250
  geospatial_lat_min: 44.5666
  geospatial_lat_max: 44.5667
  geospatial_lat_units: degree_north
  geospatial_lon_min: -124.2400
  geospatial_lon_max: -124.2401
  geospatial_lon_units: degree_east
  geospatial_vertical_min: -70
  geospatial_vertical_max: -80
  geospatial_vertical_units: meters
  geospatial_vertical_origin: sea surface
  geospatial_vertical_positive: up
  geospatial_vertical_resolution: 2 m
  source: insitu observations

coords:
  time:
    dims: [time]
    dtype: datetime64[ms]
    attrs:
      units: Seconds since 1970-01-01 00:00:00 UTC
      long_name: Time
      standard_name: time
      timezone: UTC
      coverage_content_type: coordinate
  range:
    dims: [range]
    dtype: float32
    attrs:
      description: "Distance to the center of each depth bin"
      long_name: Profile Range
      units: m
      coverage_content_type: coordinate
  dir:
    dims: [dir]
    dtype: str
    attrs:
      long_name: Reference Frame
      units: "1"
      coverage_content_type: coordinate
  dirIMU:
    dims: [dirIMU]
    dtype: str
    attrs:
      long_name: IMU Reference Frame
      units: "1"
      coverage_content_type: coordinate
  beam:
    dims: [beam]
    data: [1, 2, 3, 4]
    dtype: int32
    attrs:
      long_name: Beam Reference Frame
      units: "1"
      coverage_content_type: coordinate
  inst:
    dims: [inst]
    dtype: str
    attrs:
      long_name: Instrument Reference Frame
      units: "1"
      coverage_content_type: coordinate
  earth:
    dims: [earth]
    dtype: str
    attrs:
      long_name: Earth Reference Frame
      units: "1"
      coverage_content_type: coordinate
  x1:
    dims: [x1]
    dtype: int32
    attrs:
      long_name: Beam to Instrument Matrix Row
      units: "1"
      coverage_content_type: coordinate
  x2:
    dims: [x2]
    dtype: int32
    attrs:
      long_name: Beam to Instrument Matrix Column
      units: "1"
      coverage_content_type: coordinate

data_vars:
  vel:
    dims: [dir, range, time]
    dtype: float32
    attrs:
      long_name: Sea Water Velocity
      units: m/s
      valid_min: -2
      valid_max: 2
      _FillValue: Null
  amp:
    dims: [beam, range, time]
    dtype: float32
    attrs:
      long_name: Acoustic Signal Amplitude
      standard_name: signal_intensity_from_multibeam_acoustic_doppler_velocity_sensor_in_sea_water
      units: dB
      _FillValue: Null
  corr:
    dims: [beam, range, time]
    dtype: int32
    attrs:
      long_name: Acoustic Signal Correlation
      standard_name: beam_consistency_indicator_from_multibeam_acoustic_doppler_velocity_profiler_in_sea_water
      units: "%"
  orientmat:
    dims: [earth, inst, time]
    dtype: float32
    attrs:
      description: Earth (ENU) to instrument (XYZ) orientation matrix
      long_name: Orientation Matrix
      units: "1"
      _FillValue: Null
  beam2inst_orientmat:
    dims: [x1, x2]
    dtype: float32
    attrs:
      description: "Beam to instrument orientation matrix"
      units: "1"
      _FillValue: Null
  speed_of_sound:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Speed of Sound
      standard_name: speed_of_sound_in_sea_water
      units: m/s
      _FillValue: Null
  pressure:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Pressure
      standard_name: sea_water_pressure
      units: dbar
      _FillValue: Null
  temperature:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Temperature
      standard_name: sea_water_temperature
      units: degC
      _FillValue: Null
  depth:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Water Depth
      standard_name: depth
      units: m
      positive: up
      _FillValue: Null
  heading:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Heading
      standard_name: platform_orientation
      units: degree
      valid_min: -180
      valid_max: 180
      _FillValue: Null
  pitch:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Pitch
      standard_name: platform_pitch
      units: degree
      valid_min: -180
      valid_max: 180
      _FillValue: Null
  roll:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Roll
      standard_name: platform_roll
      units: degree
      valid_min: -180
      valid_max: 180
      _FillValue: Null
  accel:
    dims: [dirIMU, time]
    dtype: float32
    attrs:
      long_name: Accelerometer
      standard_name: platform_acceleration
      units: m/s^2
      _FillValue: Null
  mag: 
    dims: [dirIMU, time]
    dtype: float32
    attrs:
      long_name: Compass
      standard_name: platform_magnetic_field
      units: uT
      _FillValue: Null

  # Surface distance measurements for waves
  pressure_alt:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Altimeter Pressure
      standard_name: sea_water_pressure
      units: dbar
      description: "Pressure from altimeter for surface distance measurements"
      _FillValue: Null
  le_dist_alt:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Altimeter Range Leading Edge Algorithm
      standard_name: altimeter_range
      units: m
      description: "Surface distance measurement from altimeter using leading edge algorithm"
      _FillValue: Null
  le_quality_alt:
    dims: [time]
    dtype: int32
    attrs:
      long_name: Quality of Altimeter Leading Edge Algorithm
      units: "1"
      description: "Quality of surface distance measurement from altimeter using leading edge algorithm"
  ast_dist_alt:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Altimeter Range Acoustic Surface Tracking
      standard_name: altimeter_range
      units: m
      description: "Surface distance measurement from altimeter using acoustic surface tracking"
      _FillValue: Null
  ast_quality_alt:
    dims: [time]
    dtype: int32
    attrs:
      long_name: Quality of Altimeter Acoustic Surface Tracking
      units: "1"
      description: "Quality of surface distance measurement from altimeter using acoustic surface tracking"
  ast_offset_time_alt:
    dims: [time]
    dtype: float32
    attrs:
      long_name: Acoustic Surface Tracking Time Offset to Velocity Ping
      units: s
      description: "Time offset from recorded time coordinate for altimeter acoustic surface tracking"
      _FillValue: Null
