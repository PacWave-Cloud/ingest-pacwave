coords:
  time:
    dims: [time]
    dtype: datetime64[ns]
    attrs:
      long_name: Time 
      standard_name: time
      units: Seconds since 1970-01-01 00:00:00 UTC 
      cf_role: timeseries_id
      coverage_content_type: coordinate
      timezone: UTC
  freq:
    dims: [freq]
    dtype: float32
    attrs:
      long_name: Frequency
      standard_name: sound_frequency
      units: Hz
      coverage_content_type: coordinate

data_vars:
  spsdl:
    dims: [time, freq]
    dtype: float32
    attrs:
