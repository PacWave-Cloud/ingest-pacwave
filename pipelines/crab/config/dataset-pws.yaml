attrs:
  title: PacWave CRAB Hydrophone
  summary: Coastal Real-time Acoustic Buoy (CRAB) hydrophone system deployed at PacWave South
  location_id: pws
  dataset_name: crab
  data_level: a0
  qualifier: "1"
  # temporal: 
  # institution: 
  description: |
    This dataset contains acoustic data collected from hydrophones deployed at the PacWave South
    wave energy test site. The hydrophones record underwater sound levels to 
    monitor the acoustic environment and assess potential impacts of wave energy devices on marine life.
    Hydrophone data is transmitted from the lander up to a surface buoy that relays the data to shore via satellite.

  Conventions: CF-1.6, ACDD-1.3, IOOS-1.2
  keywords: HYDROPHONE, ACOUSTICS
  # keywords_vocabulary:
